.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42))}
main{max-width:520px;margin:0 auto;padding:0 18px 40px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);text-decoration:none;transition:transform .15s,background .15s,border-color .15s}
.link:hover,.link:focus-visible{transform:translateY(-2px);background:rgba(30,30,40,.62);border-color:rgba(255,255,255,.4);outline:none}
.link:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ico svg{width:26px;height:26px}
.yt{background:var(--yt)}.dc{background:var(--dc)}.tt{background:var(--tt);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

.txt b{font-size:18px;font-weight:700}
.sub{font-size:14px;color:var(--mute)}
.fol{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--mute);line-height:1.2}
.fol b{font-size:16px;color:var(--ink)}
.go{width:20px;height:20px;flex:none;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.support{margin-top:30px;padding:18px 20px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-align:center;direction:rtl}
.support p{margin:0 0 6px;font-weight:700;font-size:17px}

.support span{display:block;color:var(--mute);font-size:15px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.link{transition:none}}

.video{margin-top:30px;padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.video h2{margin:0 0 12px;font-size:17px;font-weight:800}
.video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#222}
.video p{margin:12px 0;font-size:17px;font-weight:700;line-height:1.4}
.btn{display:block;text-align:center;padding:13px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.link[aria-disabled=true]{opacity:.6;cursor:default}
.hero{height:clamp(180px,38vh,340px);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:40px}

<script>
const $=s=>document.querySelector(s);
const state=JSON.parse($('#state').textContent);
const ICONS={
yt:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M9.5 8v8l7-4z"/></svg>',
dc:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M5 7c2-1.2 4-1.7 4-1.7l.4.9c1.1-.2 3.1-.2 4.2 0l.4-.9S16 5.8 19 7c1.7 2.8 2.5 6 2.2 9.5-1.8 1.3-3.5 1.7-3.5 1.7l-.9-1.5c.6-.2 1-.5 1-.5-1 .6-2.2 1-3.4 1.1-1.3.1-2.6.1-3.9 0-1.2-.1-2.4-.5-3.4-1.1 0 0 .4.3 1 .5l-.9 1.5s-1.7-.4-3.5-1.7C2.5 13 3.3 9.8 5 7z"/><circle cx="9.2" cy="12.2" r="1.5" fill="#5865F2"/><circle cx="14.8" cy="12.2" r="1.5" fill="#5865F2"/></svg>',
tt:'<svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M13 5v9.5a3 3 0 1 1-3-3M13 5c.4 2.2 1.8 3.6 4.2 3.8"/></svg>'};
const GO='<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const ITEMS=[['yt','YouTube Channel','قناتي في اليوتيوب'],['dc','Discord Server','سيرفري الديسكورد'],['tt','TikTok','حسابي تيك توك']];
const safe=u=>/^https:\/\//i.test(u||'')?u:'';
function render(){
  const ul=$('#links');ul.textContent='';
  ITEMS.forEach(([k,t,s])=>{
    const li=document.createElement('li'),a=document.createElement('a');
    a.className='link';const u=safe(state[k]);
    if(u){a.href=u;a.target='_blank';a.rel='noopener'}else{a.setAttribute('aria-disabled','true')}
    a.innerHTML='<span class="ico '+k+'">'+ICONS[k]+'</span><span class="txt"><b>'+t+'</b><span class="sub">'+s+'</span></span>'+GO;
    li.appendChild(a);ul.appendChild(li);
  });
  const v=state.video||{},vu=safe(v.url),box=$('#video');box.textContent='';
  if(!vu){box.setAttribute('hidden','');return}
  box.removeAttribute('hidden');
  const h=document.createElement('h2');h.textContent='Last Video Has Uploaded';box.appendChild(h);
  if(/^data:image\/jpeg;base64,/.test(v.thumb||'')){const i=document.createElement('img');i.src=v.thumb;i.alt='';box.appendChild(i)}
  if(v.title){const p=document.createElement('p');p.textContent=v.title;box.appendChild(p)}
  const b=document.createElement('a');b.className='btn';b.href=vu;b.target='_blank';b.rel='noopener';b.textContent='Go To YouTube';box.appendChild(b);
}
render();
</script>
